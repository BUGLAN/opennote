; CouchDB 加固配置（`docs/执行-三端同步-密钥即身份-2026-10-13.md` §7.3）
;
; compose 把它挂成 `/opt/couchdb/etc/local.d/10-opennote.ini`。
; `local.d/` 里的文件按**文件名字典序**在 `local.ini` **之后**加载，
; 所以 `10-` 前缀保证我们的设置覆盖镜像默认值。
;
; ★ 这里**没有** `enable_cors`：唯一访问者是 Node（服务端），没有浏览器直连 CouchDB。
;   打开它只会平白多一个攻击面。

[chttpd]
; 绑定到容器内所有网卡（compose 内部可达）。
; ★ 真正的隔离来自 compose 里**故意不写 `ports:`** —— 于是它只能从 compose 网络访问，
;   公网与宿主都碰不到。这一条比 bind_address 重要得多。
bind_address = 0.0.0.0
port = 5984

; ★ 关掉 Admin Party：任何请求都必须带凭据。
;   镜像的 `COUCHDB_USER` / `COUCHDB_PASSWORD` 建的 admin 就是它要的凭据。
require_valid_user = true

; 32 MB 边上限的 base64 膨胀（×4/3 ≈ 42.7 MB）再加余量。
; 与 `MAX_FILE_BYTES` 对齐；不一致时症状是「小文件正常、大文件 413」，
; 而 413 来自 CouchDB 而不是我们 —— 排查时会先怀疑错地方。
max_http_request_size = 50331648

; 关掉 Fauxton 之外的交互式端点。（`_utils` 本身没有 hostname，公网到不了；
; 需要时用 `docker compose exec couchdb curl localhost:5984/_utils` 走容器内。）
[chttpd_auth]
; 不启用 cookie 认证：没有浏览器直连，不需要它，多一条路径多一个面。
require_valid_user = true
timeout = 600

[couchdb]
; 单节点（不是集群）。`uuid` 由镜像在首次启动时生成并写进数据目录，
; **不要**在这里写死 —— 写死会让所有部署共用同一个 uuid。
max_document_size = 50331648

; 安全：禁用需要重启才能生效的「管理接口」里的危险项不作改动，
; 但显式把默认的 `_admin` 与 `_replicator` 之外的东西留空。
[admins]
; 口令通过 compose 的环境变量注入（`COUCHDB_USER` / `COUCHDB_PASSWORD`），
; 镜像会在首次启动时把它写进数据目录里的配置。**这里不写**：
; 写在这里就会被提交进 git，而那是最不该进 git 的东西之一。

[csp]
; Fauxton 的 CSP 收紧（即使我们不让它对外，也收一下）。
default_src = 'self'
img_src = 'self' data:
script_src = 'self'
style_src = 'self' 'unsafe-inline'

[log]
level = info
; 不把请求体写进日志（笔记正文可能很大，且 E2EE 下也仍是密文——没必要留）。
include_sasl = false

[httpd]
; 老版本 HTTP 接口（5986）：关掉。只有 `chttpd`（5984）是被使用的那个。
enable_cors = false

[replicator]
; 我们**不用** CouchDB 的 replicator（同步由客户端按 §1.7 设计驱动）。
; 留着它只是多一条「谁能建 `_replicator` 文档就能让服务器去连任意地址」的路径。
max_jobs = 0
