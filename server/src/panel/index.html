<!doctype html>
<html lang="zh-CN" data-theme="paper" data-accent="seal">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 控制台与邀请页不该被搜索引擎收录。 -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <title>Opennote 同步</title>
    <link rel="stylesheet" href="/panel/tokens.css" />
    <link rel="stylesheet" href="/panel/console.css" />
    <!-- 同步执行：先定主题再画页面（不闪）。 -->
    <script src="/panel/theme.js"></script>
    <script src="/panel/icons.js" defer></script>
    <script type="module" src="/panel/app.js"></script>
  </head>
  <body>
    <!--
      /admin、/join/<码>、/reset/<码> 共用这一份外壳（server/src/routes/panel.ts），由 app.js 按路径画。
      CSP 是 script-src 'self' / style-src 'self'：这里没有内联脚本，也没有 style 属性。
      控制台的 DOM 只在服务端确认是管理员之后才生成，HTML 里不留任何管理区块。
    -->
    <div id="root"></div>
    <noscript>这个页面需要 JavaScript。</noscript>
  </body>
</html>
