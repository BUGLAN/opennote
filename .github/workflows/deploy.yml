name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # pnpm verify 覆盖类型、单测、扩展、IPC 与 bridge；本 job 再守住单仓边界规则
    # （`docs/执行-三端同步-密钥即身份-2026-10-13.md` §1.6、§10.1 F）和忽略规则产物同步。
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 最低支持版本单独钉住：服务端直接 import node:sqlite，22.13 起无需
          # --experimental-sqlite。构建 job 继续用最新 Node 22。
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 全量门禁（类型检查 / 根测试 / 扩展 / IPC / bridge）
        run: pnpm verify

      - name: Boundaries
        run: pnpm check:boundaries

      - name: 忽略规则产物与 src/sync/ignore.ts 一致
        # `electron/ignore-rules.cjs` 是构建产物但**必须提交**（主进程 require 它）。
        # 改了 `src/sync/ignore.ts` 却忘了重跑 `pnpm build:ignore` 时，这里会红。
        run: |
          pnpm build:ignore
          git diff --exit-code -- electron/ignore-rules.cjs

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # 11：与 pnpm-workspace.yaml 一致。那里用了 pnpm ≥10 才有的 allowBuilds，
          # 而 pnpm 9 读同一个文件会直接报 `packages field missing or empty`。
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        # Vite's `base` defaults to "/"; sub-path hosting (GitHub Pages) needs the repo name.
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: [checks, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
