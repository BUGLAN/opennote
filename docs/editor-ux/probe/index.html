<!doctype html>
<html lang="zh-CN" data-theme="paper" data-accent="seal" data-font="serif">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>opennote · jump probe</title>
    <!-- The real stylesheets the app ships (no app.css: the probe has no shell). -->
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/prose.css" />
    <link rel="stylesheet" href="/src/styles/editor.css" />
    <style>
      /* Minimal stand-in for `.editor-host` (app.css:975) — the probe has no shell. */
      html,
      body {
        height: 100%;
        margin: 0;
      }
      #host.editor-host {
        flex: 1;
        min-height: 0;
        overflow: hidden;
        position: relative;
        background: var(--paper);
        height: 100vh;
      }
      #host.editor-host .cm-editor {
        height: 100%;
      }
      .probe-host {
        position: relative;
        overflow: hidden;
        background: var(--paper);
      }
      .probe-host .cm-editor {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="host" class="editor-host"></div>
    <script type="module" src="./probe.ts"></script>
  </body>
</html>
