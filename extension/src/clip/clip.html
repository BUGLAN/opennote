<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Opennote 剪藏</title>
<!-- 设计令牌：与 popup 同一个文件（构建期整份复制），**不手抄色值、不新增令牌** -->
<link rel="stylesheet" href="../styles/tokens.css">
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.7 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .clip { max-width: 760px; margin: 0 auto; padding: var(--s4); display: flex; flex-direction: column; gap: var(--s2); }
  .clip__brand { margin: 0; font-size: var(--fs-lg); }
  .clip__src { margin: 0; color: var(--ink-3); font-size: var(--fs-xs); word-break: break-all; }
  .clip__label { color: var(--ink-2); font-size: var(--fs-sm); margin-top: var(--s2); }
  .clip__title { padding: var(--s2); border: 1px solid var(--rule); border-radius: var(--radius-sm); background: var(--paper-2); color: var(--ink); font: inherit; }
  .clip__body { min-height: 46vh; padding: var(--s2); border: 1px solid var(--rule); border-radius: var(--radius-sm); background: var(--paper-2); color: var(--ink); font-family: var(--font-mono, ui-monospace, monospace); font-size: var(--fs-sm); resize: vertical; }
  .clip__acts { display: flex; align-items: center; gap: var(--s2); margin-top: var(--s2); }
  .clip__msg { color: var(--ink-2); font-size: var(--fs-sm); }
  .clip__msg.is-bad { color: var(--accent); }
  .btn { padding: 6px var(--s3); border: 1px solid var(--rule-strong); border-radius: var(--radius-sm); background: var(--paper-2); color: var(--ink); font: inherit; cursor: pointer; }
  .btn--primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
</style>
</head>
<body>
<main class="clip">
  <h1 class="clip__brand">Opennote 剪藏</h1>
  <p class="clip__src" id="src"></p>
  <label class="clip__label" for="title">标题</label>
  <input class="clip__title" id="title" type="text" autocomplete="off">
  <label class="clip__label" for="body">正文（可编辑 · 所见即所剪）</label>
  <textarea class="clip__body" id="body" spellcheck="false"></textarea>
  <div class="clip__acts">
    <button type="button" class="btn btn--primary" id="save" hidden>保存到收件箱</button>
    <span class="clip__msg" id="msg" role="status"></span>
  </div>
</main>
<script type="module" src="clip.js"></script>
</body>
</html>
