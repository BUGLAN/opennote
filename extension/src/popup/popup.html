<!DOCTYPE html>
<html lang="zh-CN" data-theme="paper" data-accent="seal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>剪藏到 Opennote</title>
<!-- 设计令牌：构建期整份复制自 src/styles/tokens.css，哈希比对见 BUILD-INFO.json（不手抄色值） -->
<link rel="stylesheet" href="../styles/tokens.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="clip" id="clip" data-state="checking">
  <div class="clip__head">
    <span class="seal" aria-hidden="true">記</span>
    <span class="clip__name">Opennote<small>剪藏</small></span>
    <span class="clip__head-right">
      <span class="status-chip" id="chip" role="status" aria-live="polite" tabindex="-1"><i class="status-chip__dot" aria-hidden="true"></i><span id="chipText">正在连接本地接口…</span></span>
    </span>
  </div>

  <div class="clip__body" id="body">
    <!--
      M1 极简（00 §6.15 ㊵㊶ / task-24）：这里**只有两个按钮**——`选择当前元素` 与 `整页提取`。
    M1 freeze note: the toolbar keeps exactly two buttons (pick / extract page).
    New entries go on the clip card (an icon button), NOT as a third toolbar button.
      三区分段（正文/高亮/属性）、模板选择器、来源三选一、`存到`、`标签` 全部退场：
      界面上不留任何死元素（模板/高亮的后台模块要到 M2 才删，但用户看不到它们）。
    -->
    <div class="clip__pick" id="pickRow">
      <!-- ⑤ 选中态：`aria-pressed` 是**同一个事实**的两个消费方 —— 读屏（toggle button）与视觉
           （`.btn[aria-pressed="true"]` 用既有令牌着色）。默认选中 `整页提取`（03 §UI-01）。 -->
      <button type="button" class="btn" id="pick" aria-pressed="false">选择当前元素</button>
      <button type="button" class="btn" id="extractPage" aria-pressed="true">整页提取</button>
      <span class="clip__pick-note" id="pickNote"></span>
      <code class="clip__pick-detail" id="pickDetail" hidden></code>
    </div>

    <!-- 令牌块（㉞：配对整体删除；S6/S10/S30–S32 + C56/C57/C58/C70/C72/C73/C74） -->
    <div class="clip__token" id="tokenRow" hidden>
      <p class="clip__token-main" id="tokenMain">这个客户端还没有配置访问令牌。请在 Opennote 的「导入与接口」里复制令牌，粘贴到客户端。</p>
      <p class="clip__hint" id="tokenHint">令牌在 Opennote 的「设置 · 文件 → 导入与接口」里点「复制令牌」拿到，粘贴到这里。</p>
      <div class="clip__token-saved" id="tokenSaved" hidden>
        <code class="clip__token-code" id="tokenCode"></code>
        <button type="button" class="btn btn--ghost" id="tokenRepaste">重新粘贴令牌</button>
        <span class="clip__token-next" id="tokenNext">换一个令牌：在 Opennote 里重新生成，然后回来粘贴。</span>
      </div>
      <div class="clip__token-input" id="tokenInputRow" hidden>
        <label for="tokenInput">访问令牌</label>
        <input id="tokenInput" class="field" type="text" placeholder="粘贴访问令牌" autocomplete="off" spellcheck="false">
        <button type="button" class="btn btn--primary" id="tokenSave">连接</button>
      </div>
      <p class="clip__hint" id="tokenError" hidden></p>
      <p class="clip__hint clip__hint--cost">令牌长期有效。能读到剪贴板或插件存储的程序都能拿到它，从而往 Opennote 里导入内容；不过本地接口只提供导入，不提供读取和删除。</p>
    </div>

    <!-- 预览（单正文一条链）：来源信息由页面自动填写，提取不到的字段整行省略 -->
    <div class="clip__region" id="regionBody">
      <div id="region"></div>
    </div>

    <p class="clip__hint clip__hint--delivery" id="deliveryHint"></p>
  </div>

  <div class="clip__foot" id="foot">
    <div class="clip__acts" id="footActs"></div>
    <!--
      网页版通道（契约 02 §5.7 / FR-39）：检测到浏览器里开着 Opennote 网页版时，这一行**长出来**
      一颗整行按钮 `剪藏到 <host>`，位置就在主按钮**上方**（用户原话「在剪切上面加一个按钮」）。
      没有检测到就 `hidden` —— 界面上不留死元素。DOM 位置固定在 `#primary` 之前，
      布局靠 `popup.css` 的 `#webPrimary{flex:0 0 100%}` 独占一行（底栏本身是单行 flex）。
    -->
    <button type="button" class="btn" id="webPrimary" hidden></button>
    <button type="button" class="btn btn--primary" id="primary">剪藏到 Opennote</button>
    <button type="button" class="clip__more" id="more" title="更多" aria-label="更多" aria-haspopup="menu" aria-expanded="false"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="3" cy="8" r="1.4" fill="currentColor"></circle><circle cx="8" cy="8" r="1.4" fill="currentColor"></circle><circle cx="13" cy="8" r="1.4" fill="currentColor"></circle></svg></button>
  </div>

  <div class="clip__menu" id="menu" role="menu" aria-label="更多" hidden>
    <!--
      判定链纪律（BLOCK-1 回归点）：这个菜单里任何「落点策略」类选项都**不得**下发 `conflict: "new"`；
      进不进收件箱由**应用侧设置**决定，插件不代发指令，所以这里没有「剪藏到收件箱」项。
      M1（task-24）：`标签` 输入已退场，所以原先「用当前选区新建标签…」这个唯一标签入口也一并退场
      —— 留着它就是一个点了没反应的死元素。菜单因此从 6 项变 5 项（需要 d-ui 同步 03 C63）。
    -->
    <button type="button" role="menuitem" data-action="copy">复制 Markdown</button>
    <button type="button" role="menuitem" data-action="stage">暂存在插件里</button>
    <hr>
    <button type="button" role="menuitem" data-action="open-settings">打开 Opennote</button>
    <button type="button" role="menuitem" data-action="settings">插件设置</button>
    <button type="button" role="menuitem" data-action="forget">清除本地令牌</button>
  </div>

  <!-- C77：清除本地令牌的确认框（危险操作先确认，不清不响） -->
  <div class="clip__confirm clip__confirm--foot" id="tokenConfirm" hidden>
    <p class="clip__confirm-title">清除本地令牌？</p>
    <p class="clip__confirm-body">清除后这个客户端就不能再往 Opennote 导入，需要重新复制粘贴令牌。</p>
    <div class="clip__confirm-acts">
      <button type="button" class="btn btn--danger" id="tokenConfirmYes">清除</button>
      <button type="button" class="btn" id="tokenConfirmNo">留下</button>
    </div>
  </div>
</div>
<script type="module" src="popup.js"></script>
</body>
</html>
